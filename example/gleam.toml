name = "example"
version = "1.0.0"
gleam = ">= 1.11.0"
target = "erlang"

# A runnable Wisp/mist example of using oaisp. The endpoint declarations in
# src/example/api.gleam are what `oaisp generate` projects into openapi.json;
# src/example/router.gleam serves matching responses for the end-to-end test.
[dependencies]
oaisp = { path = ".." }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 3.7.0 and < 5.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
