name = "example"
version = "1.0.0"
gleam = ">= 1.11.0"
target = "erlang"

# A runnable example of using oaisp. The endpoint declarations in
# src/example/api.gleam are what `oaisp generate` projects into openapi.json.
[dependencies]
oaisp = { path = ".." }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
