name: Release

# Publishes oaisp to Hex when a version tag is pushed, e.g.
#   git tag v1.2.0 && git push origin v1.2.0
#
# The git tag is the source of truth for the version: the tag's version is
# written into gleam.toml before publishing, so whatever you tag is what ships.
# The Hex API key is the repository secret `HEX_KEY`, passed to `gleam publish`
# via the `HEXPM_API_KEY` environment variable it reads.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # oaisp requires OTP 27: gleam_json 3.x uses the OTP 27 `json` module.
          otp-version: "27"
          gleam-version: "1.16.0"
      - run: gleam deps download
      # Gate the publish on a green build and test run, so a broken tag can
      # never reach Hex.
      - run: gleam format --check src test
      - run: gleam test
      # Stamp the tag's version (v1.2.0 -> 1.2.0) into gleam.toml, so the tag
      # decides what gets published rather than whatever the manifest happens
      # to say.
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version = \".*\"/version = \"${version}\"/" gleam.toml
          echo "publishing version ${version}:"
          grep '^version' gleam.toml
      # `gleam publish --yes` accepts the normal prompts; the piped line answers
      # the extra confirmation Gleam requires for a below-1.0.0 release (it is
      # ignored for 1.0.0+), so any tagged version publishes non-interactively.
      - name: Publish to Hex
        run: echo "I am not using semantic versioning" | gleam publish --yes
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_KEY }}
