name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.16.0"
          # mist pulls in hpack_erl, an Erlang/rebar3 dependency, so rebar3 is
          # required to build the example (oaisp itself has no Erlang deps).
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash example/e2e/run.sh
      - run: bash example/e2e/live.sh
